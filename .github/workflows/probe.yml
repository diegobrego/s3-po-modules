name: Probe
on: push
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-nintendo'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the product page
        shell: bash
        run: |
          U="https://store.nintendo.com/de-de/nintendo-switch-2-pro-controller-the-legend-of-zelda-edition-zum-40-jubilum-aufsteller-000000000010019437"
          for UA in "ESP32HTTPClient" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"; do
            code=$(curl -sSL -m 30 -A "$UA" -o page.html -w "%{http_code} %{size_download} %{url_effective}" "$U" || true)
            echo "::notice::UA=${UA:0:20} -> $code"
          done
          echo "::notice::title: $(grep -o '<title>[^<]*' page.html | head -1 | cut -c1-150)"
          grep -oiE '"(availability|stock_status|is_in_stock|isInStock|stockStatus|salable|is_salable|orderable|inStock|stock|available|purchasable)"[^,}]{0,80}' page.html | sort | uniq -c | head -15 | while read -r l; do echo "::notice::json: $l"; done
          grep -oiE 'schema.org/[A-Za-z]+' page.html | sort | uniq -c | while read -r l; do echo "::notice::schema: $l"; done
          grep -oiE '(ausverkauft|nicht verf.gbar|nicht vorr.tig|in den warenkorb|bald erh.ltlich|vorbestell[a-z]*|benachrichtig[a-z]*|derzeit nicht[a-z ]{0,20}|out of stock|add to cart|sold out|vergriffen)' page.html | sort | uniq -c | while read -r l; do echo "::notice::text: $l"; done
          grep -oE '"price"[^,}]{0,30}|"priceCurrency"[^,}]{0,10}|[0-9]+,[0-9]{2} ?(€|&euro;)' page.html | sort | uniq -c | head -8 | while read -r l; do echo "::notice::price: $l"; done
          grep -oE 'application/ld\+json' page.html | wc -l | xargs -I{} echo "::notice::ld+json blocks: {}"
          python3 - <<'PY'
          import re
          h = open("page.html", encoding="utf-8", errors="replace").read()
          for m in re.finditer(r'<script[^>]*application/ld\+json[^>]*>(.*?)</script>', h, re.S):
              print("::notice::ld: " + re.sub(r"\s+", " ", m.group(1))[:900])
          for w in ["Warenkorb", "verfügbar", "Ausverkauft", "availability"]:
              i = h.find(w)
              if i >= 0:
                  print(f"::notice::around {w}: " + re.sub(r"\s+", " ", h[max(0, i-250):i+150]).replace("\n", " ")[:400])
          PY
